name: daftari
description: "Shop credit ledger for small shop owners in Egypt. Arabic-first, offline-first."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+1

environment:
  sdk: ^3.13.7


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  get_it: ^9.3.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  freezed: ^4.0.3



# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate localizations from the ARB files (see l10n.yaml).
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Variable.ttf
